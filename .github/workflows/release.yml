# v* 태그 푸시 시 컨테이너 이미지를 GHCR에 발행한다.
# 예: git tag v0.2.0 && git push origin v0.2.0 → ghcr.io/<owner>/periplus:0.2.0, :latest
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & push
        run: |
          TAG=${GITHUB_REF_NAME#v}
          IMG=ghcr.io/${{ github.repository_owner }}/periplus
          docker build -t "$IMG:$TAG" -t "$IMG:latest" .
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push "$IMG:$TAG"
          docker push "$IMG:latest"
      - name: Push Helm chart (OCI)
        run: |
          TAG=${GITHUB_REF_NAME#v}
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          helm package deploy/helm --version "$TAG" --app-version "$TAG"
          helm push "periplus-$TAG.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
