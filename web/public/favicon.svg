<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Periplus 마크: 다크 네이비 해도(그리드) 위 골드 점선 항로 + X(목적지).
       보물지도 모티프 — periplus(고대 항해 안내서)라는 이름을 그대로 그린다. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16294f"/>
      <stop offset="1" stop-color="#0a1228"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <path d="M0 22 H64 M0 42 H64 M22 0 V64 M44 0 V64" stroke="rgba(255,255,255,.07)" stroke-width="1.5"/>
  <path d="M13 51 C22 37 34 47 43 27" stroke="#f5b942" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="1.5 7"/>
  <circle cx="13" cy="51" r="4" fill="#f5b942"/>
  <path d="M41 14 L51 24 M51 14 L41 24" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
</svg>
