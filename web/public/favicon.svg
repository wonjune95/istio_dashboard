<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Matches the header logo: accent (blue-600) rounded square + helm wheel.
       Wheel is drawn with paths (not a ☸ glyph) so it renders on any platform. -->
  <rect width="64" height="64" rx="14" fill="#2563eb"/>
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none">
    <circle cx="32" cy="32" r="13"/>
    <!-- 8 spokes, hub to just past the rim (ship's-wheel handles) -->
    <path d="M32 32V13M32 32v19M32 32h19M32 32H13
             M32 32l13.4-13.4M32 32 18.6 18.6M32 32l13.4 13.4M32 32 18.6 45.4"/>
  </g>
  <circle cx="32" cy="32" r="5" fill="#ffffff"/>
</svg>
