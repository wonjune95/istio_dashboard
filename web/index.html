<!doctype html>
<html lang="ko" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Istio Dashboard</title>
    <script>
      // Apply saved theme before paint to avoid a flash (default dark).
      try { if (localStorage.getItem('istio-dash-theme') === 'light') document.documentElement.classList.remove('dark') } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
