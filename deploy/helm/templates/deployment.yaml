apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "istio-dashboard.fullname" . }}
  labels:
    {{- include "istio-dashboard.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "istio-dashboard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "istio-dashboard.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "istio-dashboard.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        # distroless "nonroot" is a named user; kubelet needs the numeric uid to
        # verify runAsNonRoot at admission time.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--addr=:8080"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OIDC_ISSUER
              value: {{ .Values.oidc.issuer | quote }}
            - name: OIDC_AUDIENCE
              value: {{ .Values.oidc.audience | quote }}
            # client-go / libraries may write under $HOME; point it at a writable
            # emptyDir so readOnlyRootFilesystem holds (Gemini review).
            - name: HOME
              value: /home/nonroot
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/nonroot
      volumes:
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
