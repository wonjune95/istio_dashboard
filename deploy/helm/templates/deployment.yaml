apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "istio-dashboard.fullname" . }}
  labels:
    {{- include "istio-dashboard.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "istio-dashboard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "istio-dashboard.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "istio-dashboard.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        # distroless "nonroot" is a named user; kubelet needs the numeric uid to
        # verify runAsNonRoot at admission time.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--addr=:8080"]
          ports:
            - name: http
              containerPort: 8080
          env:
            # ArgoCD 방식 로컬 계정: ConfigMap(accountsConfigMap)을 디렉터리로 마운트.
            # 한 키 = 한 사용자, 값 = "role:bcryptHash". CM 수정만으로 계정 추가/삭제.
            - name: ACCOUNTS_DIR
              value: /etc/istio-dashboard/accounts
            # 비밀번호 변경(설정 페이지)이 patch할 계정 ConfigMap 위치
            - name: ACCOUNTS_CONFIGMAP
              value: {{ .Values.accountsConfigMap | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ISTIO_NAMESPACE
              value: {{ .Values.istioNamespace | quote }}
            # client-go / libraries may write under $HOME; point it at a writable
            # emptyDir so readOnlyRootFilesystem holds (Gemini review).
            - name: HOME
              value: /home/nonroot
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/nonroot
            - name: accounts
              mountPath: /etc/istio-dashboard/accounts
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
        # 헬름이 관리하지 않는 CM(예: deploy/examples/accounts-configmap.yaml)이라
        # helm upgrade가 계정 수정을 덮어쓰지 않는다. optional: 없으면 로그인 불가로만 동작.
        - name: accounts
          configMap:
            name: {{ .Values.accountsConfigMap }}
            optional: true
