apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "periplus.fullname" . }}
  labels:
    {{- include "periplus.labels" . | nindent 4 }}
---
# 모든 클러스터 작업은 이 SA 하나로 수행하고, 사용자 권한은 앱의
# 역할(admin/editor/viewer)이 결정한다. 따라서 SA가 관리 대상 CRD 전체의 CRUD
# 권한을 가진다.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "periplus.fullname" . }}
  labels:
    {{- include "periplus.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
  # 관리 대상 리소스 (internal/k8s/registry.go 와 동일한 그룹)
  - apiGroups:
      - networking.istio.io
      - security.istio.io
      - telemetry.istio.io
      - gateway.networking.k8s.io
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # 폼 드롭다운·네임스페이스 선택용 읽기 + 흐름도의 ready 엔드포인트 수
  - apiGroups: [""]
    resources: ["namespaces", "services", "endpoints"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "periplus.fullname" . }}
  labels:
    {{- include "periplus.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "periplus.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "periplus.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
# 설정 페이지의 비밀번호 변경이 계정 ConfigMap을 patch할 수 있게 한다 (해당 CM 한정).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "periplus.fullname" . }}-accounts-writer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "periplus.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ .Values.accountsConfigMap | quote }}]
    verbs: ["get", "patch"]
  # 초기 admin/admin 자동 생성: CM이 없으면 만든다.
  # (create는 resourceNames 제한이 불가능해 네임스페이스 범위로만 좁힌다)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  # 멀티클러스터: 원격 클러스터 kubeconfig Secret 읽기/갱신 (해당 Secret 한정)
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.clustersSecret | quote }}]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "periplus.fullname" . }}-accounts-writer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "periplus.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "periplus.fullname" . }}-accounts-writer
subjects:
  - kind: ServiceAccount
    name: {{ include "periplus.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
# Read istiod's Deployment (image tag → 홈 화면의 컨트롤플레인 버전 표시).
# istiod 네임스페이스에만 한정된 읽기 권한; 실패해도 버전 미표시로 degrade한다.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "periplus.fullname" . }}-istiod-reader
  namespace: {{ .Values.istioNamespace }}
  labels:
    {{- include "periplus.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "periplus.fullname" . }}-istiod-reader
  namespace: {{ .Values.istioNamespace }}
  labels:
    {{- include "periplus.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "periplus.fullname" . }}-istiod-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "periplus.fullname" . }}
    namespace: {{ .Release.Namespace }}
