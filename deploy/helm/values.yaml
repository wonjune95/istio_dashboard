image:
  repository: istio-dashboard
  tag: dev
  pullPolicy: IfNotPresent

# e.g. [{name: regcred}] for a private registry.
imagePullSecrets: []

# 앱이 무상태라 HA가 필요하면 그냥 올리면 된다 (2+ = 무중단 롤아웃).
replicaCount: 1

service:
  type: ClusterIP
  port: 8080

# OIDC: the cluster API server must trust this same issuer (token passthrough).
# Leave issuer empty only for trusted/dev clusters — then the app does no token
# verification (Kubernetes RBAC still authorizes).
oidc:
  issuer: ""
  audience: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

serviceMonitor:
  enabled: false
