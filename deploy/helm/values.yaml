image:
  repository: ghcr.io/wonjune95/periplus
  tag: ""              # 비우면 차트 appVersion을 쓴다
  pullPolicy: IfNotPresent

# e.g. [{name: regcred}] for a private registry.
imagePullSecrets: []

# 앱이 무상태라 HA가 필요하면 그냥 올리면 된다 (2+ = 무중단 롤아웃).
replicaCount: 1

# istiod가 설치된 네임스페이스 — 홈 화면의 컨트롤플레인 버전 표시에 사용.
istioNamespace: istio-system

service:
  type: ClusterIP
  port: 8080

# 로컬 계정 ConfigMap 이름 (헬름이 만들지 않음 — deploy/examples/accounts-configmap.yaml
# 참고). 한 키 = 한 사용자, 값 = "role:bcryptHash" (role: admin|editor|viewer).
accountsConfigMap: periplus-accounts

# 멀티클러스터: 원격 클러스터 kubeconfig를 담는 Secret 이름 (key = 클러스터명,
# value = kubeconfig). 설정 페이지의 클러스터 등록 UI가 이 Secret을 관리한다.
clustersSecret: periplus-clusters

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

serviceMonitor:
  enabled: false
