# istio dashboard 앞단 SSO 게이트: oauth2-proxy + Gitea OIDC
# 사전 준비: Gitea OAuth2 앱 (redirect URI: http://dashboard.180-210-76-153.nip.io/oauth2/callback)
# 시크릿 생성:
#   kubectl -n istio-system create secret generic oauth2-proxy-gitea \
#     --from-literal=client-id=<GITEA_CLIENT_ID> \
#     --from-literal=client-secret=<GITEA_CLIENT_SECRET> \
#     --from-literal=cookie-secret=$(openssl rand -base64 32 | head -c 32)
# 적용 후 HTTPRoute istio-dashboard 의 backendRef 를 oauth2-proxy(포트 80)로 변경.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy-gitea
  namespace: istio-system
  labels: { app: oauth2-proxy-gitea }
spec:
  replicas: 1
  selector:
    matchLabels: { app: oauth2-proxy-gitea }
  template:
    metadata:
      labels: { app: oauth2-proxy-gitea }
    spec:
      containers:
        - name: oauth2-proxy
          image: harbor.114-110-181-178.nip.io/nnd/oauth2-proxy:v7.13.0
          args:
            - --provider=oidc
            - --provider-display-name=Gitea
            - --oidc-issuer-url=https://gitea.180-210-89-135.nip.io
            - --redirect-url=http://dashboard.180-210-76-153.nip.io/oauth2/callback
            - --upstream=http://istio-dashboard-istio-dashboard.istio-system.svc:8080
            - --http-address=0.0.0.0:4180
            - --email-domain=*
            - --scope=openid profile email
            - --skip-provider-button=true   # 바로 Gitea 로그인으로 리다이렉트
            - --cookie-secure=false         # 대시보드가 http 노출이라 필요
            - --cookie-expire=12h
            - --ssl-insecure-skip-verify=true  # Gitea가 사설 인증서 (nip.io)
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom: { secretKeyRef: { name: oauth2-proxy-gitea, key: client-id } }
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: oauth2-proxy-gitea, key: client-secret } }
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom: { secretKeyRef: { name: oauth2-proxy-gitea, key: cookie-secret } }
          ports:
            - containerPort: 4180
          readinessProbe:
            httpGet: { path: /ping, port: 4180 }
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy-gitea
  namespace: istio-system
  labels: { app: oauth2-proxy-gitea }
spec:
  selector: { app: oauth2-proxy-gitea }
  ports:
    - name: http
      port: 80
      targetPort: 4180
