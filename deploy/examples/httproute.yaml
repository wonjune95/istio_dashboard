# 대시보드 노출 예시 — parentRefs(클러스터의 Gateway)와 hostname을 환경에 맞게 바꾸세요.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: periplus
  namespace: istio-system
spec:
  parentRefs:
    - name: my-gateway        # 붙일 Gateway 이름
      namespace: my-gateway-ns
  hostnames:
    - dashboard.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # Helm fullname = <release>-periplus (release가 periplus면 아래 그대로)
        - name: periplus-periplus
          port: 8080
