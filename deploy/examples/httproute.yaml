# 대시보드 노출 예시 — parentRefs(클러스터의 Gateway)와 hostname을 환경에 맞게 바꾸세요.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: istio-dashboard
  namespace: istio-system
spec:
  parentRefs:
    - name: my-gateway        # 붙일 Gateway 이름
      namespace: my-gateway-ns
  hostnames:
    - dashboard.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # Helm fullname = <release>-istio-dashboard (release가 istio-dashboard면 아래 그대로)
        - name: istio-dashboard-istio-dashboard
          port: 8080
