# 파드 간 통신 데모 — 요청 콘솔로 "설정상 어디로 가나"(경로 확인)와
# "실제로 어떻게 응답하나"(보내기)를 대조해 보기 위한 최소 구성.
#
#   curl 파드 ──(사이드카)──> echo 서비스 ──> echo-v1 | echo-v2
#
# 기본은 v1, 헤더 x-user: beta 를 붙이면 v2로 간다.
# 정리: kubectl delete namespace periplus-demo
apiVersion: v1
kind: Namespace
metadata:
  name: periplus-demo
  labels:
    istio-injection: enabled
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: periplus-demo
spec:
  selector:
    app: echo
  ports:
    # Istio가 HTTP로 다루려면 포트 이름이 http 여야 한다 (프로토콜 판별 규칙).
    - name: http
      port: 8080
      targetPort: 5678
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-v1
  namespace: periplus-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: echo, version: v1}
  template:
    metadata:
      labels: {app: echo, version: v1}
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0.0
          args: ["-text=hello from v1", "-listen=:5678"]
          ports: [{containerPort: 5678}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-v2
  namespace: periplus-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: echo, version: v2}
  template:
    metadata:
      labels: {app: echo, version: v2}
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0.0
          args: ["-text=hello from v2", "-listen=:5678"]
          ports: [{containerPort: 5678}]
---
# 요청을 보낼 클라이언트 — curl이 들어 있어 요청 콘솔의 출발 파드로 쓸 수 있다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: curl
  namespace: periplus-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: curl}
  template:
    metadata:
      labels: {app: curl}
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.11.1
          command: ["sleep", "infinity"]
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: echo
  namespace: periplus-demo
spec:
  host: echo.periplus-demo.svc.cluster.local
  subsets:
    - name: v1
      labels: {version: v1}
    - name: v2
      labels: {version: v2}
---
# 메시 내부 라우팅(gateways: mesh) — 인그레스가 아니라 파드 간 통신에 적용된다.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: echo
  namespace: periplus-demo
spec:
  hosts:
    - echo.periplus-demo.svc.cluster.local
  gateways:
    - mesh
  http:
    # 카나리: 이 헤더가 있을 때만 v2
    - match:
        - headers:
            x-user:
              exact: beta
      route:
        - destination:
            host: echo.periplus-demo.svc.cluster.local
            subset: v2
    # 기본 경로
    - route:
        - destination:
            host: echo.periplus-demo.svc.cluster.local
            subset: v1
