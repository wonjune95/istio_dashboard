apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard-editor
  namespace: istio-system
---
# Editor role for dashboard users: full CRUD on Istio + Gateway API config,
# read-only on namespaces/services (reference dropdowns). Its token is pasted
# into the dashboard; the backend passes it through to the API server so this
# RBAC — not the dashboard — authorizes every call.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: istio-dashboard-editor
rules:
  - apiGroups: ["networking.istio.io", "security.istio.io", "telemetry.istio.io", "gateway.networking.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["namespaces", "services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: istio-dashboard-editor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: istio-dashboard-editor
subjects:
  - kind: ServiceAccount
    name: dashboard-editor
    namespace: istio-system
