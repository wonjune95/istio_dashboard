# Istio Dashboard 로컬 계정.
# - 한 키 = 한 사용자, 값 = "역할:bcrypt해시" (역할: admin | editor | viewer)
# - viewer는 조회만, editor/admin은 변경 가능.
# - 헬름이 관리하지 않으므로 kubectl로 직접 적용/수정한다. 수정 후 재시작 불필요
#   (마운트된 ConfigMap은 1분 내 자동 반영).
#
# 해시 생성:  go run ./hack/bcrypt-hash.go '비밀번호'
# 계정 추가:  kubectl -n istio-system edit configmap istio-dashboard-accounts
apiVersion: v1
kind: ConfigMap
metadata:
  name: istio-dashboard-accounts
  namespace: istio-system
data:
  admin: "admin:<bcrypt-hash>"
  # viewer1: "viewer:<bcrypt-hash>"
